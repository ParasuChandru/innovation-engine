# Innovation Engine Selenium Test Configuration
# JIRA Story: RBTES-1035 - SPOC Dashboard Feature

# Application URL
base.url=http://localhost:5000

# Browser Configuration
browser=chrome
headless=true

# Timeout Settings (in seconds)
implicit.wait=5
explicit.wait=10
page.load.timeout=30

# Screenshot Settings
screenshot.dir=test-output/screenshots
screenshot.on.failure=true

# Report Settings
report.dir=test-output/reports
report.title=Innovation Engine Test Report
report.name=SPOC Dashboard Feature Tests

