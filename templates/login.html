<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Innovation Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center p-3 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl shadow-lg mb-4">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-900">Innovation Engine</h1>
            <p class="text-gray-600 mt-2">Transform ideas into reality</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-xl shadow-xl p-6">
            <div class="mb-6">
                <h2 class="text-xl font-semibold">Welcome Back</h2>
                <p class="text-gray-500 text-sm">Enter your email to access the platform</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="mb-4 p-3 rounded-lg {% if category == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %} text-sm">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="your.email@company.com">
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-blue-700 transition-colors">
                    Sign In
                </button>
            </form>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <span class="w-full border-t border-gray-200"></span>
                </div>
                <div class="relative flex justify-center text-xs uppercase">
                    <span class="bg-white px-2 text-gray-500">Demo Accounts</span>
                </div>
            </div>

            <div class="space-y-2">
                <button onclick="document.getElementById('email').value='admin@company.com'" 
                    class="w-full flex items-center justify-between p-3 rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors text-left">
                    <div>
                        <div class="font-medium text-sm">Admin</div>
                        <div class="text-xs text-gray-500">admin@company.com</div>
                    </div>
                    <div class="text-xs text-gray-400">Full Access</div>
                </button>
                <button onclick="document.getElementById('email').value='robert.brown@company.com'"
                    class="w-full flex items-center justify-between p-3 rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors text-left">
                    <div>
                        <div class="font-medium text-sm">CGI Executive</div>
                        <div class="text-xs text-gray-500">robert.brown@company.com</div>
                    </div>
                    <div class="text-xs text-gray-400">CGI Approvals</div>
                </button>
                <button onclick="document.getElementById('email').value='david.lee@company.com'"
                    class="w-full flex items-center justify-between p-3 rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors text-left">
                    <div>
                        <div class="font-medium text-sm">LT Executive</div>
                        <div class="text-xs text-gray-500">david.lee@company.com</div>
                    </div>
                    <div class="text-xs text-gray-400">LT Approvals</div>
                </button>
                <button onclick="document.getElementById('email').value='sarah.johnson@company.com'"
                    class="w-full flex items-center justify-between p-3 rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors text-left">
                    <div>
                        <div class="font-medium text-sm">SPOC</div>
                        <div class="text-xs text-gray-500">sarah.johnson@company.com</div>
                    </div>
                    <div class="text-xs text-gray-400">Manage Ideas</div>
                </button>
                <button onclick="document.getElementById('email').value='john.smith@company.com'"
                    class="w-full flex items-center justify-between p-3 rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors text-left">
                    <div>
                        <div class="font-medium text-sm">Owner</div>
                        <div class="text-xs text-gray-500">john.smith@company.com</div>
                    </div>
                    <div class="text-xs text-gray-400">Submit Ideas</div>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
